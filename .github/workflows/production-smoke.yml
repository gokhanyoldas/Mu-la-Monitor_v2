name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Preview veya Production URL (https://...)"
        required: true
        type: string
      ai_proxy:
        description: "Maliyetli Gemini proxy smoke çağrısını çalıştır"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_AI_PROXY: ${{ inputs.ai_proxy }}
        run: npm run smoke:production
