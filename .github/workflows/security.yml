name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Haftalık güvenlik taraması (Pazartesi 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Not: Typecheck/lint/test/build doğrulamaları ci.yml içinde çalışır.
# Bu workflow yalnızca bağımlılık güvenlik taramasına odaklanır (mükerrer CI yok).
jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Full dependency audit (report)
        run: npm audit --audit-level=moderate || true
